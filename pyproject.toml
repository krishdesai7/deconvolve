[build-system]
# Floor measured, not current: every uv_build back to 0.7.0 builds a wheel
# identical to 0.12.17's (same file list, same METADATA), and 0.6.3 fails.
# 0.7.19 is where the backend left preview, which is the lowest bound that
# costs nothing. The cap is the 0.13 line, not a measurement.
requires = ["uv_build>=0.7.19,<0.13"]
build-backend = "uv_build"


[project]
name = "deconvolve"
version = "0.3.0"
description = "Unbinned, full-phase-space unfolding by adversarial reweighting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beartype>=0.19.0,<=0.22.9",
    "jax>=0.7.0,<=0.11.2 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "jax[cuda13]>=0.7.0,<=0.11.2 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "jaxtyping>=0.2.36,<=0.3.11",
    "keras>=3.5.0,<=3.15.1",
    "matplotlib>=3.8.4,<=3.11.2",
    "numpy>=2.0.0,<=2.5.3",
    "pyyaml>=6.0.1,<=6.0.3",
    "typer>=0.16.0,<=0.27.2",
]

[project.scripts]
deconvolve = "deconvolve.__main__:main"

[project.urls]
repository = "https://github.com/krishdesai7/deconvolve"
Changelog = "https://github.com/krishdesai7/deconvolve/blob/master/CHANGELOG.md"
Releases = "https://github.com/krishdesai7/deconvolve/releases"

[[project.authors]]
name = "Krish Desai"
email = "krish@desai.ml"


# Floors here are measured against this checkout, not set to whatever was
# current: each is the oldest release that gives the same verdict on this
# code as the capped version, so a contributor's existing toolchain is more
# likely to satisfy the group. The caps are the versions this was validated
# against. Lower any floor only with the check that fixed it re-run.
#
#   complexipy    8.0.0  first to honour `cache-dir`; 5.x-7.x score the same
#                        but write `.complexipy_cache/` into the repo root
#   prek          0.4.0  first to read `prek.toml`; 0.3.13 reads it but sees
#                        only the first repo, and 0.3.0 and older want
#                        `.pre-commit-config.yaml`
#   pyrefly       1.3.0  1.2.x reports 5 diagnostics, 1.0/1.1 reject the
#                        config outright
#   ruff          0.16.6 0.16.5 flags I001 on a file 0.16.6 accepts; 0.13-0.15
#                        reject the `runtime-cast-value` selector and 0.12 and
#                        older reject `lint.future-annotations`
#   rust-just     1.35.0 oldest on PyPI; the recipes use nothing newer
#   types-pyyaml  6.0.12 the whole dated 6.0.12.* line type-checks identically
#   ipykernel     6.29.5 no coupling to this code at all -- notebook kernels
#                        only. Verified to import and start on 3.14
#
# `pytest-env` and `pytest-xdist` stay pinned: their floors can only be
# established by running the suite, which is an HPC job here, not a laptop one.
[dependency-groups]
dev = [
    {include-group = "test"},
    "complexipy>=8.0.0,<=8.0.1",
    "ipykernel>=6.29.5,<=7.3.0",
    "prek>=0.4.0,<=0.5.3",
    "pyrefly>=1.3.0,<=1.3.1",
    "pytest-env==1.7.1",
    "pytest-xdist==3.8.0",
    "ruff>=0.16.6,<=0.16.8",
    "rust-just>=1.35.0,<=1.58.0",
    "types-pyyaml>=6.0.12,<=6.0.12.20260906",
]

# Running tests, benchmarks or legacy code requires this dependency group
test = [
    "pytest>=9.0.2,<=9.1.1",
    "pytest-cov==7.1.0",
    "scipy>=1.13.0,<=1.18.1",
    "scipy-stubs>=1.14.1.1,<=1.18.1.0",
]
# Pinned because 0.1.0 is the only alternative and it does not import: its
# unbounded `hishel` dependency resolves to a version where
# `hishel.Controller` no longer exists.
release = ["rooster==0.1.1"]
docs = [
    "mkdocstrings-python>=2.0.9,<=2.0.9",
    # Capped: Zensical is pre-1.0 and its MkDocs-plugin compatibility layer
    # (mkdocstrings, literate-nav) is still moving between releases.
    "zensical>=0.0.65,<=0.0.65",
]


[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# `uv check` (the ty wrapper `just typecheck` and CI both run) does not exist
# before 0.12.0, and 0.12.0-0.12.2 fail it with a spurious
# `invalid uv workspace metadata JSON` diagnostic. 0.12.3 is the first
# release where every command this project uses -- `sync --locked`,
# `format`, `check`, `audit`, `lock` -- passes on this checkout.
required-version = ">=0.12.3"
preview-features = true
cache-keys = [{ file = "pyproject.toml" }]

[tool.uv.build-backend]
module-name = "deconvolve"


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
filterwarnings = [
    # `keras.Variable.__array__` takes only `dtype`, but NumPy 2 also requires a `copy` kwarg, so every `model.save()` trips this from inside Keras's own `convert_to_numpy`. Third-party and unfixed as of keras 3.15.1.
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
    # `train()` points XLA's persistent cache at `COMPILE_CACHE_DIR`. A sandboxed or read-only `.cache/` costs the run nothing but a recompile. "ignore:Error (reading|writing) persistent compilation cache entry:UserWarning",
]
addopts = "-xqn8 --dist loadscope --cov deconvolve"
env = [
    "OMP_NUM_THREADS = 1",
    "OPENBLAS_NUM_THREADS = 1",
    "MKL_NUM_THREADS = 1",
    "XLA_PYTHON_CLIENT_PREALLOCATE = false",
]


[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
search-path = ["src", "."]
site-package-path = []
check-unannotated-defs = true
infer-return-types = "checked"
preset = "all"
treat-all-caps-as-final = true
permissive-ignores = true
strict-callable-subtyping = true
strict-partial-subtyping = true
project-excludes = [
    "legacy",
    # The quarantined TensorFlow workers import packages that cannot exist
    # in this project's environment -- that impossibility is the point of
    # them. Type-checking them here can only ever report missing-import.
    "**/*_worker.py",
]

[tool.pyrefly.errors]
explicit-any = false # npt.NDArray[T] is an alias for np.ndarray[tuple[Any, ...], T]
implicit-bool = false # complaints about np.bool to python bool conversions
implicit-any-lambda = false # Python does not allow lambda with type hints

[tool.ty]
src.exclude = ["legacy"]

[tool.ruff]
src = ["."]
line-length = 88
extend-exclude = ["*.ipynb", "legacy"]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
future-annotations = true
preview = true
# Physics notation
allowed-confusables = ["σ", "×", "Δ"]
extend-select = [
    "B",   # flake8-bugbear: likely bugs / footguns
    "I",   # isort-style import checks
    "UP",  # pyupgrade: modern Python syntax
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes (catches undefined variables, broken logic, unused imports)
    "C90", # mccabe: Cyclomatic complexity limits (keeps functions small and readable)
    "N",   # pep8-naming: Enforces PEP 8 naming conventions (PascalCase classes, snake_case functions)
    "ASYNC", # flake8-async: Catches bad async programming practices and deadlocks
    "S",   # flake8-bandit: Security auditing (e.g., hardcoded credentials, unsafe temp files)
    "A",   # flake8-builtins: Prevents shadowing built-in names (e.g., re-defining `id`, `list`, or `format`)
    "FA",  # flake8-future-annotations: Enforces modern postponed annotations behavior
    "PIE", # flake8-pie: Code simplification suggestions
    "PT",  # flake8-pytest-style: Enforces idiomatic pytest fixture/assertion style
    "RET", # flake8-return: Simplifies return statements (removes unnecessary else/elif blocks)
    "SIM", # flake8-simplify: Refactors unnecessarily complex logic into cleaner idiomatic Python
    "ARG", # flake8-unused-arguments: Flags unused function arguments
    "PTH", # flake8-use-pathlib: Forces the use of modern `pathlib.Path` over legacy `os.path`
    "PGH", # pygrep-hooks: Prevents generic blanket `# type: ignore` or `# noqa` directives without specific error codes
    "RUF", # Ruff-specific rules: Catches edge-cases, invalid regexes, and native Ruff optimization hints
    "PERF", # Perflint: Highlights performance anti-patterns in loops and data structures
    "FURB", # refurb: Modernizes older idiom patterns to modern Python standards
    "T20",  # (flake8-print): Disallows print() statements in production code. Useful if you want to force all output through logging or dedicated output pipelines.
    "LOG",  # (flake8-logging): Flags logging anti-patterns (such as string formatting inside logger calls instead of passing lazy arguments).
    "TC",  # (flake8-type-checking): Automatically moves type-only imports behind if TYPE_CHECKING: blocks to reduce runtime import overhead.
]
ignore = [
    "runtime-cast-value",
    # jaxtyping puts the shape spec in a string subscript, e.g.
    # `Float[Array, " n d"]`, which F722 reads as a broken forward annotation.
    "forward-annotation-syntax-error",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["assert"]
# `pass_name` is a `timing.write` parameter naming which pipeline pass
# produced a phase record ("train" / "load"), not a credential; bandit's
# hardcoded-password check matches on the "pass" substring in the arg name.
"tests/test_timing.py" = ["hardcoded-password-func-arg", "hardcoded-password-string"]
# Benchmarks report to a terminal and are read by a human running them by hand;
# routing that through the logging config would bury the numbers. They also
# shell out to developer tools by bare name (`uv`, `nvidia-smi`): the absolute
# path differs per machine and per driver package, and resolving on PATH is the
# behaviour wanted, not an oversight.
"benchmarks/**.py" = ["T20", "start-process-with-partial-path"]
# package __init__ is the backend bootstrap: must set KERAS_BACKEND and
# JAX_ENABLE_X64 before anything imports jax or keras. See module docstring.
"src/deconvolve/__init__.py" = ["non-empty-init-module"]

# The quarantined OmniFold/TensorFlow workers run under Python 3.13 exactly
# (TF ships no 3.14 wheels), so they are pinned here rather than left to
# inherit the project's floor. The project floor is `>=3.12`, so today this
# pin RAISES the worker's target rather than lowering it -- it says "3.13, no
# more and no less", which is what the PEP 723 header also says. It was
# load-bearing when the floor was `>=3.14`: ruff inferred `py314` and its
# formatter rewrote `except (A, B):` into PEP 758's unparenthesized form, a
# SyntaxError on 3.13 that took the worker down at import. That specific trap
# is gone with the floor at 3.12, but the pin is what keeps it gone if the
# floor ever rises again. `tests/test_omnifold.py` compiles the worker.
[tool.ruff.per-file-target-version]
"**/*_worker.py" = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true


# Version bumps are inferred from the labels on the PRs merged since the last
# tag. `major-labels` is deliberately empty: 1.0 is reserved for the first PyPI
# publication, so no label can drive the version past 0.x. A `breaking` PR takes
# the minor slot instead, which is the usual reading of semver below 1.0.
[tool.rooster]
changelog-contributors = false
major-labels = []
minor-labels = ["breaking"]
ignore-labels = ["internal", "ci", "testing", "automations"]

[tool.rooster.section-labels]
"Breaking changes" = ["breaking"]
"Enhancements" = ["enhancement", "compatibility", "error messages"]
"Preview features" = ["preview"]
"Configuration" = ["configuration"]
"Performance" = ["performance"]
"Bug fixes" = ["bug"]
"Documentation" = ["documentation"]
"Other changes" = ["__unknown__"]


[tool.complexipy]
paths = ["."]
max-complexity-allowed = 10
sort = "desc"
check-script = true
no-ignore = true
ignore-complexity = true
failed = true
cache-dir = ".cache/complexipy"


[tool.tombi]
toml-version = "v1.1.0"

[tool.tombi.format.rules]
group-blank-lines-limit = 2
indent-sub-tables = true
indent-table-key-value-pairs = true
key-value-equals-sign-alignment = true
table-blank-lines = 2
trailing-comment-alignment = true


[tool.tombi.extensions."tombi-toml/pyproject"]
lsp.document-link.pypi-org.enabled = true
